plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'dev.echo'
version = '0.1.0'

base {
    archivesName = 'echo-addon-gradle-plugin'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

gradlePlugin {
    plugins {
        echoSdk {
            id = 'dev.echo.sdk'
            implementationClass = 'dev.echo.gradle.EchoSdkPlugin'
            displayName = 'ECHO Add-on SDK'
            description = 'Registers ECHO SDK add-on validation, packaging, parity, and release tasks.'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
