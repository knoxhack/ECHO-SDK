name: Docs Audit

on:
  push:
  pull_request:

jobs:
  docs-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/docs-audit.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/echo_sdk.py validate templates --json
      - run: python tools/validate_echo_contracts.py --json
      - run: python tools/test_echo_contract_schemas.py --json
